name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vgosti
          POSTGRES_PASSWORD: vgosti
          POSTGRES_DB: vgosti_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Apply test-DB migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://vgosti:vgosti@localhost:5433/vgosti_test?schema=public
      - run: npm run test:e2e

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y sshpass
          sshpass -e rsync -az --delete \
            --exclude 'node_modules' --exclude 'dist' --exclude '.git' \
            --exclude 'docker-compose.yml' --exclude '.env' --exclude '.env.test' \
            --exclude 'uploads' \
            --exclude 'firebase-service-account.json' --exclude '*-firebase-adminsdk*.json' \
            --exclude 'public/downloads' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/root/vgosti-backend/"
          sshpass -e ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /root/vgosti-backend && docker compose -p vgosti -f docker-compose.yml -f docker-compose.prod.yml up -d --build"
